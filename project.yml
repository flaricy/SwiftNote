name: SwiftNote
options:
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    ENABLE_DEBUG_DYLIB: NO
    MARKETING_VERSION: '1.1.1'
    CURRENT_PROJECT_VERSION: '6'
    CODE_SIGN_STYLE: Automatic
packages:
  SwiftMath:
    path: Vendor/SwiftMath
targets:
  SwiftNoteMac:
    type: application
    platform: macOS
    sources:
      - Source
      - path: Assets/AppIcon.icns
        buildPhase: resources
    dependencies:
      - package: SwiftMath
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.flaricy.SwiftNote
        PRODUCT_NAME: 随记
        EXECUTABLE_NAME: LocalNotes
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Config/Mac-Info.plist
      properties:
        CFBundleDisplayName: SwiftNote
        CFBundleName: SwiftNote
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconFile: AppIcon
        NSRequiresAquaSystemAppearance: true
        NSHighResolutionCapable: true
  Regression:
    type: tool
    platform: macOS
    sources:
      - Source/Model.swift
      - Source/Editor.swift
      - Source/MathFormula.swift
      - Source/FormulaEditor.swift
      - Source/Localization.swift
      - Tests
    dependencies:
      - package: SwiftMath
    settings:
      base:
        PRODUCT_NAME: Regression
schemes:
  SwiftNoteMac:
    build:
      targets:
        SwiftNoteMac: all
  Regression:
    build:
      targets:
        Regression: all
